<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='20' width='56' height='24' rx='4' fill='%23f5c518'/><rect x='4' y='20' width='10' height='24' rx='3' fill='%23234ea8'/></svg>">
<style>
:root{
  --bg:#12141a; --panel:#1b1e27; --panel2:#232735; --line:#2f3444; --text:#e8eaf0; --muted:#9aa1b3;
  --accent:#f5c518; --accent-ink:#1a1400; --good:#3ecf8e; --bad:#ff5d6c; --blue:#5b8cff;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo .plate{width:38px;height:16px;border-radius:3px;background:linear-gradient(90deg,#234ea8 0 22%,var(--accent) 22%)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600}
nav button.on{background:var(--panel2);color:var(--text)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip small{opacity:.7;margin-left:4px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:11px 20px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--muted);font-size:13px}
.poolcount{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.score b{color:var(--text)}
.imgwrap{background:#0b0c10;border-radius:var(--radius);display:flex;justify-content:center;align-items:center;min-height:260px;max-height:52vh;overflow:hidden;cursor:zoom-in;border:1px solid var(--line)}
.imgwrap img{max-width:100%;max-height:52vh;min-height:240px;object-fit:contain;display:block}
.question{font-weight:700;font-size:17px;margin:16px 0 10px;display:flex;align-items:center;gap:10px}
.step{font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt kbd{font:600 11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:auto}
.opt.good{background:rgba(62,207,142,.15);border-color:var(--good)}
.opt.bad{background:rgba(255,93,108,.15);border-color:var(--bad)}
.opt:disabled{cursor:default}
.flag{width:24px;height:16px;object-fit:cover;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.feedback{margin-top:14px;border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--panel2)}
.feedback .verdict{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.feedback .verdict.good{color:var(--good)} .feedback .verdict.bad{color:var(--bad)}
.feedback p{margin:8px 0 0;color:#cfd3de}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
.tag.ml{color:var(--accent);border-color:rgba(245,197,24,.5)}
.next{margin-top:14px;display:flex;gap:10px;align-items:center}
.typebox{position:relative;max-width:460px}
.typebox input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);outline:none;font-size:16px}
.typebox input:focus{border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:5}
.sugg div{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.sugg div.on,.sugg div:hover{background:var(--line)}
.sugg small{color:var(--muted);margin-left:auto;font-size:12px}

/* compare (wrong answer) */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#0b0c10}
.cmp figure.yours{border-color:var(--bad)} .cmp figure.right{border-color:var(--good)}
.cmp .thumb{height:150px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.cmp .thumb img{max-width:100%;max-height:150px;object-fit:contain}
.cmp .noimg{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;color:var(--muted);font-size:13px;text-align:center}
.cmp figcaption{padding:8px 10px;font-size:13px;display:flex;align-items:center;gap:8px;background:var(--panel);font-weight:600}
.cmp figcaption small{color:var(--muted);font-weight:500;margin-left:auto}
.simline{margin-top:10px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.simline b{color:var(--text)}
.tag.same{color:var(--text)} .tag.only-a{border-color:rgba(255,93,108,.5)} .tag.only-b{border-color:rgba(62,207,142,.5)}
.keydiff{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:14px}
/* mix-ups */
.mix{margin-bottom:18px}
.mix .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.mix .pair{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.mix .pair .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}
.empty{color:var(--muted);padding:30px 10px;text-align:center}
/* study views + front plates map */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.fmap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:relative}
.fmap svg{display:block;width:100%;height:auto}
.fmap path{stroke:var(--bg);stroke-width:.6;cursor:pointer;transition:opacity .15s}
.fmap path.k-both{fill:#4a6fd1} .fmap path.k-rear{fill:var(--accent)} .fmap path.k-mostly{fill:#9a7fe0}
.fmap path.recent{stroke:#fff;stroke-width:1.4;stroke-dasharray:3 2}
.fmap path.dim{opacity:.18} .fmap path.sel{stroke:#fff;stroke-width:2.2;stroke-dasharray:none}
.fmap path:focus-visible{outline:none;stroke:#fff;stroke-width:2.2}
.ftip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap;display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.legend .chip{display:flex;align-items:center;gap:8px}
.legend .chip.off{opacity:.45}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.sw.k-both{background:#4a6fd1} .sw.k-rear{background:var(--accent)} .sw.k-mostly{background:#9a7fe0}
.sw.recent{background:none;border:1.5px dashed var(--text)}
.finfo{margin-top:12px;min-height:58px}
.finfo .name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.finfo p{margin:6px 0 0;color:#cfd3de}
/* regional mode */
.rmap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-top:10px;position:relative}
.rmap .hov{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:2;pointer-events:none}
.rmap .hit{fill:transparent;stroke:none;cursor:pointer}
.rmap .frame{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.rmap .cities{pointer-events:none}
.rmap .cities circle{fill:#fff;stroke:#111;stroke-width:1}
.rmap .cities text{fill:#e9ecf3;font-size:12px;font-weight:600;paint-order:stroke;stroke:rgba(10,12,18,.85);stroke-width:3px;stroke-linejoin:round}
.rmap.nocities .cities{display:none}
.rtip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600;white-space:nowrap;display:none;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.rtip small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;min-height:38px}
.rbar .toggle{margin-left:auto}
.rbar .confirm{display:none}
.rbar .confirm.on{display:inline-flex}
.vbadge{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.vtag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;margin-bottom:6px}
#qimgwrap{position:relative}
@media (max-width:600px){ .rmap .cities text{font-size:14px;stroke-width:3px} }
.rmap svg{display:block;width:100%;height:auto;max-height:58vh;margin:0 auto}
.rmap path{outline:none}
.rmap .units path{fill:#3a4157;stroke:var(--bg);stroke-width:.8;cursor:pointer}
.rmap .units path.hover{fill:#55607d}
.rmap .units path:focus-visible{outline:none;fill:#55607d}
.rmap.done .units path{cursor:default} .rmap.done .units path.hover{fill:#3a4157}
.rmap .units path.good,.rmap.done .units path.good{fill:var(--good)} .rmap .units path.bad,.rmap.done .units path.bad{fill:var(--bad)}
.rmap .units path.nodata{fill:#2a2f3f}
.rmap .units path.sel{stroke:#fff;stroke-width:2}
img.blurred{filter:blur(3px)}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.strip .thumb{flex:none;height:64px;width:auto;background:#0b0c10;border-radius:6px;overflow:hidden;cursor:zoom-in;display:flex;align-items:center}
.strip .thumb img{height:64px;width:auto;display:block}
.strip .thumb.sim{outline:1px dashed var(--muted);outline-offset:-1px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;scroll-margin-top:80px}
.rcard.hl{border-color:var(--accent)}
.rcard h4{margin:0 0 6px;font-size:16px}
.rcard .design{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rcard .design:first-of-type{border-top:0;padding-top:0}
.rcard .refs{display:flex;gap:6px;flex-wrap:wrap}
.rcard .refs .thumb{background:#fff;border-radius:6px;cursor:zoom-in;display:flex}
.rcard .refs img{max-height:72px;max-width:100%;display:block}
/* summary */
.big{font-size:40px;font-weight:800}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 18px}
.stats div span{display:block;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card .thumb{height:150px;background:#0b0c10;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.card .thumb img{max-width:100%;max-height:150px;object-fit:contain}
.card .body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.card .name{font-weight:700;display:flex;align-items:center;gap:8px}
.card .note{font-size:13px;color:#c4c9d6}
.card .yours{font-size:12px;color:var(--bad)}
.card.hidden .reveal{display:none}
.card .cover{display:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.card.hidden .cover{display:block}
.studybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.studybar input,.studybar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted);font-size:14px}
.switch input{accent-color:var(--accent);width:16px;height:16px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;image-rendering:auto;min-width:min(90vw,800px);object-fit:contain}
.hidden-el{display:none!important}
@media (max-width:600px){ .cmp .thumb,.cmp .noimg{height:110px;min-height:110px} .cmp .thumb img{max-height:110px} header{padding:10px 14px} .logo span{display:none} .opts{grid-template-columns:1fr 1fr} .opt kbd{display:none} }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="plate"></div><span>Plate Trainer</span></div>
  <nav>
    <button id="tab-quiz" class="on">Quiz</button>
    <button id="tab-study">Study</button>
  </nav>
</header>
<main>
  <!-- SETUP -->
  <section id="setup" class="panel">
    <h2>New round</h2>
    <h3>Game</h3>
    <div class="row" id="opt-game"></div>
    <div id="country-opts">
    <h3>Answer mode</h3>
    <div class="row" id="opt-mode">
      <div class="chip" data-v="mcq">Multiple choice</div>
      <div class="chip" data-v="duel">Duel (2 lookalikes)</div>
      <div class="chip" data-v="type">Type the country</div>
    </div>
    <h3>Continents</h3>
    <div class="row" id="opt-continents"></div>
    <h3>Category</h3>
    <div class="row" id="opt-category"></div>
    </div>
    <div id="region-opts" class="hidden-el">
      <h3>Plates</h3>
      <div class="row" id="opt-recent"><div class="chip" data-v="all">All designs</div><div class="chip" data-v="recent">Recent coverage only (2019+)</div></div>
    </div>
    <h3>Round length</h3>
    <div class="row" id="opt-length">
      <div class="chip" data-v="10">10</div>
      <div class="chip" data-v="20">20</div>
      <div class="chip" data-v="0">All</div>
    </div>
    <div class="poolcount">
      <button class="btn" id="start">Start</button>
      <span class="hint" id="poolinfo"></span>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden-el">
    <div class="qtop">
      <button class="btn ghost" id="quit" style="padding:7px 12px">✕ Quit</button>
      <div class="bar"><i id="progress"></i></div>
      <div class="score" id="scoreline"></div>
    </div>
    <div class="imgwrap" id="qimgwrap"><img id="qimg" alt="License plate"><span class="vbadge hidden-el" id="vbadge"></span></div>
    <div id="qarea"></div>
  </section>

  <!-- SUMMARY -->
  <section id="summary" class="hidden-el"></section>

  <!-- STUDY -->
  <section id="study" class="hidden-el">
    <div class="seg" id="s-views"><button data-v="plates" class="on">Plates</button><button data-v="front">Front plates map</button></div>
    <div id="s-front" class="hidden-el"></div>
    <div id="s-region" class="hidden-el"></div>
    <div id="s-plates">
    <div class="studybar">
      <button class="pill hidden-el" id="s-pill" title="Show all countries"></button>
      <input id="s-search" placeholder="Search country or note…" style="min-width:200px">
      <select id="s-cont"></select>
      <select id="s-cat"></select>
      <label class="switch"><input type="checkbox" id="s-hide"> Hide answers (flashcards)</label>
      <span class="hint" id="s-count"></span>
    </div>
    <div class="mix hidden-el" id="s-mix"></div>
    <div class="grid" id="s-grid"></div>
    </div>
  </section>
</main>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>

<script src="data/countries.js"></script>
<script src="data/plates.js"></script>
<script src="data/pairs.js"></script>
<script src="data/frontplates.js"></script>
<script src="data/frontmap.js"></script>
<script src="data/regions/mx.js"></script>
<script src="data/regions/mx-map.js"></script>
<script src="data/regions/us.js"></script>
<script src="data/regions/us-map.js"></script>
<script src="data/regions/ca.js"></script>
<script src="data/regions/ca-map.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- data prep ----------
  const C = {}; COUNTRIES.forEach(c => C[c.n] = c);
  const bad = PLATES.filter(p => !C[p.country]);
  if (bad.length) console.warn('Plates with unknown country (add them to countries.js):', bad.map(p => p.country));
  PLATES.forEach(p => { p.continent = p.continent || (C[p.country] && C[p.country].c); });
  // Country look-tags = countries.js tags ∪ tags of its dataset plates
  const ctags = {};
  COUNTRIES.forEach(c => ctags[c.n] = new Set(c.t || []));
  PLATES.forEach(p => { (ctags[p.country] ||= new Set()); p.tags.forEach(t => ctags[p.country].add(t)); });

  const flag = n => { const c = C[n]; return c ? `<img class="flag" src="https://flagcdn.com/w40/${c.f.toLowerCase()}.png" alt="" loading="lazy" onerror="this.style.display='none'">` : ''; };

  const CATS = [['all', 'All plates'], ['ml', '★ Must learn'], ...Object.entries(TAG_LABELS)];
  const inCat = (p, cat) => cat === 'all' || (cat === 'ml' ? p.mustLearn : p.tags.includes(cat));

  // ---------- settings ----------
  const DEF = { game: 'countries', mode: 'mcq', continents: CONTINENTS.slice(), category: 'all', length: '20' };
  let S = DEF;
  try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem('plateTrainer.settings') || '{}')); } catch (e) {}
  if (!['mcq', 'duel', 'type'].includes(S.mode)) S.mode = 'mcq';
  const RG = window.REGIONS || {}, RM = window.REGION_MAPS || {};
  if (S.game !== 'countries' && !(RG[S.game] && RM[S.game])) S.game = 'countries';
  const save = () => { try { localStorage.setItem('plateTrainer.settings', JSON.stringify(S)); } catch (e) {} };

  function bindSingle(id, key) {
    const el = $(id);
    el.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { S[key] = ch.dataset.v; save(); renderSetup(); });
  }
  bindSingle('#opt-mode', 'mode'); bindSingle('#opt-length', 'length');

  // Regional rounds: one item per Street View crop; country = region name so summary/retry work unchanged
  const regionName = (rk, code) => (RM[rk].units.find(u => u.code === code) || {}).name || code;
  function regionItems(rk) {
    const out = [];
    const recentOnly = S.recentOnly && Object.values(RG[rk].units).some(u => u.designs.some(d => d.recent));
    Object.entries(RG[rk].units).forEach(([code, u]) => u.designs.forEach((d, di) => (recentOnly && !d.recent ? [] : d.crops).forEach(c =>
      out.push({ region: rk, code, design: di, img: c.img, blur: !!c.blur, vehicle: c.vehicle || d.vehicle || null, country: regionName(rk, code), note: u.note || '', tags: [], lookalikes: [] }))));
    return out;
  }
  const pool = () => S.game !== 'countries' ? regionItems(S.game) : PLATES.filter(p => S.continents.includes(p.continent) && inCat(p, S.category));

  function renderSetup() {
    $('#opt-game').innerHTML = [['countries', 'Countries', PLATES.length], ...Object.keys(RG).filter(k => RM[k]).map(k => [k, RG[k].label || `${RG[k].name} ${RG[k].unit}s`, regionItems(k).length])]
      .map(([k, l, n]) => `<div class="chip ${S.game === k ? 'on' : ''}" data-v="${k}">${esc(l)}<small>${n}</small></div>`).join('');
    $('#opt-game').querySelectorAll('.chip').forEach(ch => ch.onclick = () => { S.game = ch.dataset.v; save(); renderSetup(); });
    $('#country-opts').classList.toggle('hidden-el', S.game !== 'countries');
    const hasRecent = S.game !== 'countries' && Object.values(RG[S.game].units).some(u => u.designs.some(d => d.recent));
    $('#region-opts').classList.toggle('hidden-el', !hasRecent);
    $('#opt-recent').querySelectorAll('.chip').forEach(ch => { ch.classList.toggle('on', (S.recentOnly ? 'recent' : 'all') === ch.dataset.v); ch.onclick = () => { S.recentOnly = ch.dataset.v === 'recent'; save(); renderSetup(); }; });
    ['#opt-mode:mode', '#opt-length:length'].forEach(x => {
      const [id, k] = x.split(':');
      $(id).querySelectorAll('.chip').forEach(ch => ch.classList.toggle('on', ch.dataset.v === S[k]));
    });
    $('#opt-continents').innerHTML = CONTINENTS.map(c => {
      const n = PLATES.filter(p => p.continent === c).length;
      return `<div class="chip ${S.continents.includes(c) ? 'on' : ''}" data-v="${c}">${c}<small>${n}</small></div>`;
    }).join('');
    $('#opt-continents').querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
      const v = ch.dataset.v;
      S.continents = S.continents.includes(v) ? S.continents.filter(x => x !== v) : [...S.continents, v];
      save(); renderSetup();
    });
    $('#opt-category').innerHTML = CATS.map(([k, l]) => {
      const n = PLATES.filter(p => inCat(p, k)).length;
      return n ? `<div class="chip ${S.category === k ? 'on' : ''}" data-v="${k}">${esc(l)}<small>${n}</small></div>` : '';
    }).join('');
    $('#opt-category').querySelectorAll('.chip').forEach(ch => ch.onclick = () => { S.category = ch.dataset.v; save(); renderSetup(); });
    const n = pool().length;
    $('#poolinfo').textContent = n ? `${n} plate${n > 1 ? 's' : ''} in pool${S.game !== 'countries' ? ' · click the ' + RG[S.game].unit + ' on the map' : ''}` : 'No plates match these filters';
    $('#start').disabled = !n;
  }

  // ---------- distractors ----------
  const jitter = () => Math.random() * 0.9;
  function countryScore(plate, name) {
    let s = jitter();
    if (plate.lookalikes.includes(name)) s += 100;
    const tg = ctags[name] || new Set();
    plate.tags.forEach(t => { if (tg.has(t)) s += (t === 'eu-strip' ? 3 : 10); });
    if (C[name] && C[name].c === plate.continent) s += 5;
    return s;
  }
  function countryOptions(plate) {
    const cands = COUNTRIES.map(c => c.n).filter(n => n !== plate.country);
    const picked = cands.map(n => [n, countryScore(plate, n)]).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
    return shuffle([plate.country, ...picked]);
  }
  // Look similarity = Jaccard index of the two countries' look tags (null if either has none)
  function similarity(a, b) {
    const A = ctags[a] || new Set(), B = ctags[b] || new Set();
    if (!A.size || !B.size) return null;
    let inter = 0; A.forEach(t => { if (B.has(t)) inter++; });
    return inter / (A.size + B.size - inter);
  }
  // ---------- mix-ups (persisted confusion counts: "truth|answer" -> n) ----------
  const MIX_KEY = 'plateTrainer.mixups';
  let MIX = {};
  try { MIX = JSON.parse(localStorage.getItem(MIX_KEY) || '{}'); } catch (e) {}
  const saveMix = () => { try { localStorage.setItem(MIX_KEY, JSON.stringify(MIX)); } catch (e) {} };
  function recordMix(truth, answer) { if (!C[answer] || truth === answer) return; const k = truth + '|' + answer; MIX[k] = (MIX[k] || 0) + 1; saveMix(); }
  // Unordered pairs, most confused first: [{a, b, ab, ba, n}]
  function mixPairs() {
    const m = {};
    Object.entries(MIX).forEach(([k, n]) => {
      const [t, a] = k.split('|'); const [x, y] = [t, a].sort(); const key = x + '|' + y;
      const o = m[key] ||= { a: x, b: y, ab: 0, ba: 0, n: 0 };
      if (t === x) o.ab += n; else o.ba += n; o.n += n;
    });
    return Object.values(m).sort((p, q) => q.n - p.n || p.a.localeCompare(q.a));
  }
  const pairKey = (a, b) => [a, b].sort().join('|');
  // Duel opponent: your own mix-ups first, then dataset lookalikes, then the hardest distractor
  function duelOpponent(p, onlyMix) {
    const mine = mixPairs().filter(x => x.a === p.country || x.b === p.country).map(x => x.a === p.country ? x.b : x.a);
    if (onlyMix && mine.length) return mine[Math.random() * Math.min(mine.length, 3) | 0];
    const look = p.lookalikes.filter(n => n !== p.country);
    const pool = [...new Set([...mine.slice(0, 2), ...look.slice(0, 2)])];
    if (pool.length) return pool[Math.random() * pool.length | 0];
    return countryOptions(p).find(n => n !== p.country);
  }
  // ---------- quiz ----------
  let Q = null;
  function start(list, opts = {}) {
    let items = shuffle(list || pool());
    const L = +S.length; if (!list && L) items = items.slice(0, L);
    const region = opts.region || (list ? null : (S.game !== 'countries' ? S.game : null)) || (items[0] && items[0].region) || null;
    Q = { items, i: 0, ok: 0, missed: [], region, duel: !region && (opts.duel || S.mode === 'duel'), onlyMix: !!opts.onlyMix, label: opts.label || (region ? RG[region].name : '') };
    show('quiz'); nextPlate();
  }
  function updateTop() {
    $('#progress').style.width = (Q.i / Q.items.length * 100) + '%';
    $('#scoreline').innerHTML = `${Q.label ? esc(Q.label) + ' · ' : ''}<b>${Math.min(Q.i + 1, Q.items.length)}</b>/${Q.items.length} · Correct <b>${Q.ok}</b>`;
  }
  function nextPlate() {
    if (Q.i >= Q.items.length) return summary();
    const p = Q.items[Q.i];
    $('#qimg').src = p.img;
    $('#qimg').classList.toggle('blurred', !!p.blur);
    const veh = vehicleOf(p);
    $('#vbadge').classList.toggle('hidden-el', !veh);
    if (veh) $('#vbadge').textContent = VEH[veh] || veh;
    updateTop();
    if (Q.region) askRegion(p);
    else if (Q.duel) askCountry(p, shuffle([p.country, duelOpponent(p, Q.onlyMix)]), 'Which of the two?');
    else if (S.mode === 'type') askType(p);
    else askCountry(p, countryOptions(p), 'Which country?');
  }
  function optButtons(list, render) {
    return `<div class="opts">${list.map((v, i) => `<button class="opt" data-v="${esc(v)}">${render(v)}<kbd>${i + 1}</kbd></button>`).join('')}</div>`;
  }
  function wireOpts(onPick) {
    const btns = [...$('#qarea').querySelectorAll('.opt')];
    btns.forEach(b => b.onclick = () => onPick(b.dataset.v, btns));
    keyHandler = e => { const k = +e.key; if (k >= 1 && k <= btns.length && !btns[0].disabled) btns[k - 1].click(); };
  }
  function mark(btns, correct, picked) {
    btns.forEach(b => { b.disabled = true; if (b.dataset.v === correct) b.classList.add('good'); else if (b.dataset.v === picked) b.classList.add('bad'); });
  }
  function askCountry(p, options, question) {
    $('#qarea').innerHTML = `<div class="question">${question}</div>` + optButtons(options, v => flag(v) + esc(v));
    wireOpts((v, btns) => { mark(btns, p.country, v); finish(p, v); });
  }
  // ---------- vehicle type ----------
  const VEH = { taxi: '🚕 Taxi', truck: '🚚 Truck', bus: '🚌 Bus', commercial: '🚕 Taxi / commercial', moto: '🏍 Motorbike' };
  const vehicleOf = p => p.vehicle || (p.tags && p.tags.includes('commercial') ? 'commercial' : null);
  // front-plate rule for a region unit, from data/frontplates.js
  const frontRule = (rk, code) => (window.FRONT_RULES && FR[rk.toUpperCase() + '-' + code]) || null;
  // only worth showing where the rule differs between units (all of Mexico has front and rear plates)
  const frontVaries = rk => new Set(RM[rk].units.map(u => (frontRule(rk, u.code) || {}).k)).size > 1;
  const FRONT_TXT = { rear: 'Rear plate only', both: 'Front and rear plates', mostly: 'Front and rear, front often missing' };

  // regional: click the region on the map
  // Map of a region set: units, insets, small-unit hit areas, hover outline, big cities, tooltip
  function regionSvg(rk, cls) {
    const M = RM[rk], R = RG[rk], units = M.units.slice().sort((a, b) => b.area - a.area);
    const has = c => R.units[c] && R.units[c].designs.length;
    return `<div class="rmap ${cls || ''} ${S.cities === false ? 'nocities' : ''}" data-rk="${rk}"><svg viewBox="0 0 ${M.w} ${M.h}" role="group" aria-label="Map of ${esc(R.name)}">
      ${(M.frames || []).map(f => `<rect class="frame" x="${f[0]}" y="${f[1]}" width="${f[2]}" height="${f[3]}" rx="6"/>`).join('')}
      <g class="units">${units.map(u => `<path d="${u.d}" data-c="${u.code}" tabindex="0" aria-label="${esc(u.name)}" class="${has(u.code) ? '' : 'nodata'}"/>`).join('')}</g>
      <g class="hits">${units.filter(u => u.area < 700).map(u => `<circle class="hit" cx="${u.cx}" cy="${u.cy}" r="11" data-c="${u.code}"/>`).join('')}</g>
      <path class="hov" d=""/>
      <g class="cities">${(M.cities || []).map(c => `<circle cx="${c.x}" cy="${c.y}" r="3"/><text x="${c.a === 'e' ? c.x - 6 : c.x + 6}" y="${c.y + 4 + (c.dy || 0)}"${c.a === 'e' ? ' text-anchor="end"' : ''}>${esc(c.name)}</text>`).join('')}</g>
    </svg><div class="rtip"></div></div>`;
  }
  // Hover/tap behaviour. onPick(code) is called on click; on touch screens the first tap selects and a Confirm button commits.
  function wireRegionMap(box, rk, onPick, bar) {
    const map = box.querySelector('.rmap'), M = RM[rk], R = RG[rk], tip = map.querySelector('.rtip'), hov = map.querySelector('.hov');
    const unit = c => M.units.find(u => u.code === c);
    let touch = false, pending = null;
    const show = (code, e) => {
      const u = unit(code); if (!u) return;
      map.querySelectorAll('.units path.hover').forEach(x => x.classList.remove('hover'));
      map.querySelector(`.units path[data-c="${code}"]`).classList.add('hover');
      hov.setAttribute('d', u.d);
      const d = R.units[code], fr = frontVaries(rk) && frontRule(rk, code);
      tip.innerHTML = `${esc(u.name)}${map.classList.contains('done') || !map.classList.contains('quiz') ? `<small>${d && d.designs.length ? d.designs.length + ' design' + (d.designs.length > 1 ? 's' : '') : 'no plate data'}${fr ? ' · ' + FRONT_TXT[fr.k].toLowerCase() : ''}</small>` : ''}`;
      tip.style.display = 'block';
      const r = map.getBoundingClientRect();
      let x, y;
      if (e && e.clientX != null) { x = e.clientX - r.left + 14; y = e.clientY - r.top + 16; }
      else { const svg = map.querySelector('svg').getBoundingClientRect(); x = (u.cx / M.w) * svg.width + (svg.left - r.left) + 10; y = (u.cy / M.h) * svg.height + (svg.top - r.top) + 10; }
      tip.style.left = Math.max(4, Math.min(x, r.width - tip.offsetWidth - 4)) + 'px';
      tip.style.top = Math.min(y, r.height - tip.offsetHeight - 4) + 'px';
    };
    const hide = () => { if (pending) return; tip.style.display = 'none'; hov.setAttribute('d', ''); map.querySelectorAll('.units path.hover').forEach(x => x.classList.remove('hover')); };
    const targets = map.querySelectorAll('.units path, .hits circle');
    targets.forEach(t => {
      const code = t.dataset.c;
      t.addEventListener('pointerdown', e => { touch = e.pointerType === 'touch' || e.pointerType === 'pen'; });
      t.addEventListener('pointermove', e => { if (!touch && !pending) show(code, e); });
      t.addEventListener('pointerleave', () => { if (!touch) hide(); });
      t.addEventListener('focus', () => show(code));
      t.addEventListener('blur', hide);
      t.addEventListener('click', e => {
        if (touch && bar) { pending = code; show(code, e); const c = bar.querySelector('.confirm'); c.classList.add('on'); c.textContent = `Confirm ${unit(code).name}`; return; }
        onPick(code);
      });
      t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(code); } });
    });
    if (bar) {
      bar.querySelector('.confirm').onclick = () => { if (pending) { const c = pending; pending = null; bar.querySelector('.confirm').classList.remove('on'); onPick(c); } };
      bar.querySelector('.toggle').onclick = () => { S.cities = S.cities === false; save(); map.classList.toggle('nocities', S.cities === false); bar.querySelector('.toggle').textContent = S.cities === false ? 'Show cities' : 'Hide cities'; };
    }
    return { clearPending: () => { pending = null; if (bar) bar.querySelector('.confirm').classList.remove('on'); hide(); } };
  }
  const mapBar = () => `<div class="rbar"><button class="btn confirm"></button><button class="btn ghost toggle">${S.cities === false ? 'Show cities' : 'Hide cities'}</button></div>`;
  function askRegion(p) {
    const R = RG[p.region];
    $('#qarea').innerHTML = `<div class="question">Which ${R.unit}?</div>` + regionSvg(p.region, 'quiz') + mapBar();
    const map = $('#qarea .rmap');
    const ctl = wireRegionMap($('#qarea'), p.region, code => {
      if (map.classList.contains('done')) return;
      ctl.clearPending();
      map.classList.add('done');
      map.querySelector(`.units path[data-c="${p.code}"]`).classList.add('good');
      if (code !== p.code) map.querySelector(`.units path[data-c="${code}"]`).classList.add('bad');
      finish(p, regionName(p.region, code));
    }, $('#qarea .rbar'));
    keyHandler = null;
  }
  const thumbImg = (src, blur, sim) => `<div class="thumb${sim ? ' sim' : ''}" data-img="${esc(src)}"${sim ? ' title="Simulated blur"' : ''}><img src="${esc(src)}" alt="" loading="lazy"${blur ? ' class="blurred"' : ''}></div>`;
  // Feedback for a regional answer: the design of the region you clicked vs the design shown
  function regionCompareHtml(p, answer) {
    const R = RG[p.region], M = RM[p.region];
    const right = R.units[p.code].designs[p.design];
    const others = right.crops.filter(c => c.img !== p.img);
    const pickedCode = (M.units.find(u => u.name === answer) || {}).code;
    const pu = pickedCode && R.units[pickedCode];
    const fig = (refs, label, cls, empty) => `<figure class="${cls}">${refs.length ? `<div class="thumb" data-img="${esc(refs[0])}" style="background:#fff"><img src="${esc(refs[0])}" alt=""></div>` : `<div class="noimg">${empty}</div>`}<figcaption>${esc(label)}<small>${cls === 'right' ? 'correct' : 'your answer'}${refs.length > 1 ? ' · 1 of ' + refs.length : ''}</small></figcaption></figure>`;
    let html = '';
    if (answer !== p.country) {
      const prefs = pu ? pu.designs.flatMap(d => d.refs) : [];
      html += `<div class="cmp">${fig(prefs, answer, 'yours', `No plate for ${esc(answer)} in the data yet`)}${fig(right.refs, p.country, 'right', '')}</div>`;
    } else if (right.refs.length) {
      html += `<div class="strip">${right.refs.map(r => thumbImg(r)).join('')}</div>`;
    }
    if (others.length) html += `<div class="simline">Same design${R.note ? ' (blurred)' : ' on Street View'}:</div><div class="strip">${others.map(c => thumbImg(c.img, c.blur, c.sim)).join('')}</div>`;
    const fr = frontVaries(p.region) && frontRule(p.region, p.code);
    if (fr) html += `<div class="simline">${esc(p.country)}: <b>${FRONT_TXT[fr.k]}</b>${fr.note ? ' · ' + esc(fr.note) : ''}</div>`;
    return html;
  }

  // typing
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const NAMES = COUNTRIES.map(c => ({ n: c.n, c: c.c, keys: [c.n, ...(c.a || [])].map(norm) }));
  function suggest(q) {
    q = norm(q); if (!q) return [];
    const r = [];
    NAMES.forEach(x => {
      let best = 99;
      x.keys.forEach(k => {
        if (k === q) best = Math.min(best, 0);
        else if (k.startsWith(q)) best = Math.min(best, 1);
        else if (k.split(' ').some(w => w.startsWith(q))) best = Math.min(best, 2);
        else if (q.length > 2 && k.includes(q)) best = Math.min(best, 3);
      });
      if (best < 99) r.push([x, best]);
    });
    return r.sort((a, b) => a[1] - b[1] || a[0].n.localeCompare(b[0].n)).slice(0, 7).map(x => x[0]);
  }
  function askType(p) {
    $('#qarea').innerHTML = `<div class="question">Which country?</div>
      <div class="typebox"><input id="tin" autocomplete="off" spellcheck="false" placeholder="Start typing… (Enter to submit)"><div class="sugg hidden-el" id="sugg"></div></div>
      <div class="hint" style="margin-top:8px">↑/↓ to pick a suggestion · Enter to submit · empty Enter = give up</div>`;
    const tin = $('#tin'), sg = $('#sugg'); let list = [], sel = 0;
    const draw = () => {
      list = suggest(tin.value); sel = Math.min(sel, Math.max(0, list.length - 1));
      sg.classList.toggle('hidden-el', !list.length);
      sg.innerHTML = list.map((x, i) => `<div class="${i === sel ? 'on' : ''}" data-i="${i}">${flag(x.n)}${esc(x.n)}<small>${esc(x.c)}</small></div>`).join('');
      sg.querySelectorAll('div').forEach(d => d.onmousedown = e => { e.preventDefault(); submit(list[+d.dataset.i].n); });
    };
    const submit = name => { tin.disabled = true; sg.classList.add('hidden-el'); finish(p, name || '(no answer)'); };
    tin.oninput = () => { sel = 0; draw(); };
    tin.onkeydown = e => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, list.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); submit(list.length ? list[sel].n : ''); }
    };
    keyHandler = null;
    setTimeout(() => tin.focus(), 30);
  }

  function finish(p, answer) {
    const ok = answer === p.country;
    if (ok) Q.ok++; else { Q.missed.push({ p, answer }); recordMix(p.country, answer); }
    Q.i++; updateTop();
    const tags = [p.mustLearn ? '<span class="tag ml">★ Must learn</span>' : '', ...p.tags.map(t => `<span class="tag">${esc(TAG_LABELS[t] || t)}</span>`)].join('');
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = `<div class="verdict ${ok ? 'good' : 'bad'}">${ok ? '✓ Correct' : '✗ ' + esc(answer)} ${ok ? '' : '<span style="color:var(--muted);font-weight:600">→</span>'} ${flag(p.country)}<span style="color:var(--text)">${esc(p.country)}</span></div>
      ${p.region ? regionCompareHtml(p, answer) : (!ok && C[answer] ? compareHtml(p, answer) : '')}
      <p>${esc(p.note)}</p><div class="tags">${tags}</div>`;
    $('#qarea').appendChild(fb);
    wireThumbs(fb);
    const nx = document.createElement('div');
    nx.className = 'next';
    nx.innerHTML = `<button class="btn" id="nextbtn">${Q.i >= Q.items.length ? 'See results' : 'Next'} →</button><span class="hint">Enter / Space</span>`;
    $('#qarea').appendChild(nx);
    const go = () => { keyHandler = null; nextPlate(); };
    $('#nextbtn').onclick = go;
    setTimeout(() => { keyHandler = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; }, 150);
    nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Side-by-side: the plate of the country you picked vs the plate shown
  function compareHtml(p, answer) {
    const theirs = PLATES.filter(x => x.country === answer);
    const ref = theirs.find(x => x.lookalikes.includes(p.country)) || theirs[0];
    const tagsOf = n => [...(ctags[n] || [])];
    const tagChips = (list, cls) => list.map(t => `<span class="tag ${cls}">${esc(TAG_LABELS[t] || t)}</span>`).join('');
    const yours = ref
      ? `<div class="thumb" data-img="${esc(ref.img)}"><img src="${esc(ref.img)}" alt=""></div>`
      : `<div class="noimg">No ${esc(answer)} plate in the dataset yet<div class="tags" style="justify-content:center">${tagChips(tagsOf(answer), '') || 'No look tags either'}</div></div>`;
    const sim = similarity(p.country, answer);
    const A = ctags[answer] || new Set(), B = ctags[p.country] || new Set();
    const same = [...B].filter(t => A.has(t)), onlyA = [...A].filter(t => !B.has(t)), onlyB = [...B].filter(t => !A.has(t));
    const note = (window.PAIR_NOTES || {})[pairKey(p.country, answer)];
    let simTxt = '';
    if (sim !== null) {
      simTxt = `<div class="simline">Look similarity <b>${Math.round(sim * 100)}%</b>${tagChips(same, 'same')}${tagChips(onlyA, 'only-a')}${tagChips(onlyB, 'only-b')}</div>`;
      if (sim >= 0.99 && !note) simTxt += `<div class="simline">Same look tags: the difference is in the details, compare the two plates above.</div>`;
    }
    return `<div class="cmp">
        <figure class="yours">${yours}<figcaption>${flag(answer)}${esc(answer)}<small>your answer${theirs.length > 1 ? ` · 1 of ${theirs.length}` : ''}</small></figcaption></figure>
        <figure class="right"><div class="thumb" data-img="${esc(p.img)}"><img src="${esc(p.img)}" alt=""></div><figcaption>${flag(p.country)}${esc(p.country)}<small>correct</small></figcaption></figure>
      </div>${simTxt}${note ? `<div class="keydiff">${esc(note)}</div>` : ''}`;
  }

  function summary() {
    keyHandler = null;
    const n = Q.items.length, pct = Math.round(Q.ok / n * 100);
    const missed = Q.missed.map(({ p, answer }) => `<div class="card"><div class="thumb" data-img="${esc(p.img)}"><img src="${esc(p.img)}" alt=""${p.blur ? ' class="blurred"' : ''}></div>
      <div class="body"><div class="name">${flag(p.country)}${esc(p.country)}</div><div class="yours">You said: ${flag(answer)}${esc(answer)}</div><div class="note">${esc(p.note)}</div></div></div>`).join('');
    $('#summary').innerHTML = `<div class="panel"><h2>Round complete</h2>
      <div class="stats"><div><div class="big">${pct}%</div><span>correct (${Q.ok}/${n})</span></div></div>
      <div class="row"><button class="btn" id="again">New round</button>${Q.missed.length ? `<button class="btn ghost" id="retry">Retry the ${Q.missed.length} missed</button>` : ''}<button class="btn ghost" id="tosetup">Settings</button></div></div>
      ${missed ? `<h3 style="margin-top:22px">Missed</h3><div class="grid">${missed}</div>` : ''}`;
    show('summary');
    $('#again').onclick = () => Q.onlyMix ? drillMix() : start();
    $('#tosetup').onclick = () => show('setup');
    if ($('#retry')) { const m = Q.missed.map(x => x.p), d = Q.duel, om = Q.onlyMix, lb = Q.label, rg = Q.region; $('#retry').onclick = () => start(m, { duel: d, onlyMix: om, label: lb, region: rg }); }
    wireThumbs($('#summary'));
  }

  // ---------- study ----------
  function initStudy() {
    $('#s-cont').innerHTML = `<option value="">All continents</option>` + CONTINENTS.map(c => `<option>${c}</option>`).join('');
    $('#s-cat').innerHTML = CATS.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('');
    ['#s-search', '#s-cont', '#s-cat', '#s-hide'].forEach(id => $(id).addEventListener('input', renderStudy));
    $('#s-pill').onclick = () => { SC = null; if (location.hash) history.replaceState(null, '', location.pathname + location.search); renderStudy(); };
  }
  let SC = null; // country opened through #iso
  function drillMix() {
    const names = new Set(); mixPairs().forEach(x => { names.add(x.a); names.add(x.b); });
    const list = PLATES.filter(p => names.has(p.country));
    if (list.length) start(list, { duel: true, onlyMix: true, label: 'Mix-ups' });
  }
  function renderMix() {
    const box = $('#s-mix'), pairs = mixPairs();
    const drillable = pairs.some(x => PLATES.some(p => p.country === x.a || p.country === x.b));
    box.classList.toggle('hidden-el', !pairs.length || !!SC);
    if (!pairs.length || SC) return;
    const arrow = (n, from, to) => n ? `<span title="${esc(from)} plate, you said ${esc(to)}">${n}×</span>` : '';
    box.innerHTML = `<h3 style="margin-top:0">Your mix-ups</h3><div class="list">${pairs.slice(0, 12).map(x => {
      const sim = similarity(x.a, x.b);
      return `<div class="pair">${flag(x.a)}${esc(x.a)} <span style="color:var(--muted)">/</span> ${flag(x.b)}${esc(x.b)}<span class="n">${x.n}×${sim !== null ? ` · ${Math.round(sim * 100)}% alike` : ''}</span></div>`;
    }).join('')}</div>
      <div class="row" style="margin-top:10px">${drillable ? '<button class="btn" id="mix-drill">Drill my mix-ups</button>' : ''}<button class="btn ghost" id="mix-reset">Reset</button></div>`;
    if ($('#mix-drill')) $('#mix-drill').onclick = drillMix;
    $('#mix-reset').onclick = () => { if (confirm('Forget all recorded mix-ups?')) { MIX = {}; saveMix(); renderMix(); } };
  }
  function renderStudy() {
    const q = norm($('#s-search').value), ct = $('#s-cont').value, cat = $('#s-cat').value, hide = $('#s-hide').checked;
    const pill = $('#s-pill');
    pill.classList.toggle('hidden-el', !SC);
    if (SC) pill.innerHTML = `${flag(SC)}${esc(SC)} ✕`;
    renderMix();
    const list = PLATES.filter(p => (!SC || p.country === SC) && (!ct || p.continent === ct) && inCat(p, cat) && (!q || norm(p.country + ' ' + p.note).includes(q)))
      .sort((a, b) => CONTINENTS.indexOf(a.continent) - CONTINENTS.indexOf(b.continent) || a.country.localeCompare(b.country));
    $('#s-count').textContent = `${list.length} plate${list.length === 1 ? '' : 's'}`;
    $('#s-grid').innerHTML = list.map(p => `<div class="card ${hide ? 'hidden' : ''}">
      <div class="thumb" data-img="${esc(p.img)}"><img src="${esc(p.img)}" alt="" loading="lazy"></div>
      <div class="body"><div class="cover">Click to reveal</div>
        <div class="reveal"><div class="name">${flag(p.country)}${esc(p.country)} <span class="step">${esc(p.continent)}</span></div>
        <div class="note" style="margin-top:6px">${esc(p.note)}</div>
        <div class="tags">${p.mustLearn ? '<span class="tag ml">★ Must learn</span>' : ''}${p.tags.map(t => `<span class="tag">${esc(TAG_LABELS[t] || t)}</span>`).join('')}</div>
        ${p.lookalikes.length ? `<div class="hint" style="margin-top:6px">Don't confuse with: ${p.lookalikes.map(esc).join(', ')}</div>` : ''}</div>
      </div></div>`).join('') || `<div class="empty">${SC && !PLATES.some(p => p.country === SC) ? `No ${esc(SC)} plate in the dataset yet.` : 'No plate matches these filters.'}</div>`;
    $('#s-grid').querySelectorAll('.cover').forEach(c => c.onclick = () => c.closest('.card').classList.remove('hidden'));
    wireThumbs($('#s-grid'));
  }

  // ---------- front plates map ----------
  const KINDS = [['rear', 'Rear plate only'], ['both', 'Front and rear'], ['mostly', 'Front and rear, often missing']];
  const FR = {};   // "US-OH" -> {k, since, note}
  Object.entries(FRONT_RULES).forEach(([cc, byK]) => Object.entries(byK).forEach(([k, list]) => list.forEach(u => {
    FR[cc + '-' + u] = Object.assign({ k }, FRONT_NOTES[cc + '-' + u] || {});
  })));
  const RECENT_FROM = 2019;
  let SV = 'plates', FSEL = null, FOFF = new Set();
  const COUNTRY_OF = code => ({ US: 'United States', CA: 'Canada', MX: 'Mexico' })[code.slice(0, 2)];
  function setView(v) {
    SV = v;
    $('#s-views').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    $('#s-plates').classList.toggle('hidden-el', v !== 'plates');
    $('#s-front').classList.toggle('hidden-el', v !== 'front');
    $('#s-region').classList.toggle('hidden-el', !v.startsWith('r:'));
    if (v === 'front') renderFront(); else if (v.startsWith('r:')) renderRegion(v.slice(2)); else renderStudy();
  }
  Object.keys(RG).filter(k => RM[k]).forEach(k => $('#s-views').insertAdjacentHTML('beforeend', `<button data-v="r:${k}">${esc(RG[k].label || RG[k].name + ' ' + RG[k].unit + 's')}</button>`));
  $('#s-views').querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));
  function renderFront() {
    const M = FRONT_MAP, box = $('#s-front');
    const missing = M.units.filter(u => !FR[u.code]).map(u => u.code);
    if (missing.length) console.warn('No front-plate rule for', missing);
    const count = k => M.units.filter(u => FR[u.code] && FR[u.code].k === k).length;
    const recent = M.units.filter(u => FR[u.code] && FR[u.code].since >= RECENT_FROM).length;
    // small units last so they stay clickable on top
    const units = M.units.slice().sort((a, b) => b.area - a.area);
    box.innerHTML = `<div class="legend">${KINDS.map(([k, l]) => `<div class="chip ${FOFF.has(k) ? 'off' : ''}" data-k="${k}" title="Show / hide"><span class="sw k-${k}"></span>${l}<small>${count(k)}</small></div>`).join('')}
        <div class="chip ${FOFF.has('recent') ? 'off' : ''}" data-k="recent" title="Show / hide the outline"><span class="sw recent"></span>Changed since ${RECENT_FROM}<small>${recent}</small></div></div>
      <div class="fmap"><svg viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="Front plate rules in the United States, Canada and Mexico">
        ${units.map(u => { const r = FR[u.code] || {}; const rec = r.since >= RECENT_FROM && !FOFF.has('recent');
          return `<path d="${u.d}" data-c="${u.code}" tabindex="0" class="k-${r.k || 'none'}${rec ? ' recent' : ''}${FOFF.has(r.k) ? ' dim' : ''}${FSEL === u.code ? ' sel' : ''}"><title>${esc(u.name)}</title></path>`; }).join('')}
      </svg><div class="ftip" id="ftip"></div></div>
      <div class="finfo panel" id="finfo"></div>
      <p class="hint">Rules for passenger cars. Street View often predates a change, so check the coverage year against the dashed units. Sources: Wikipedia articles on US, Canadian and Mexican plates (read October 2026).</p>`;
    box.querySelectorAll('.legend .chip').forEach(ch => ch.onclick = () => { const k = ch.dataset.k; FOFF.has(k) ? FOFF.delete(k) : FOFF.add(k); renderFront(); });
    const tip = $('#ftip'), wrap = box.querySelector('.fmap');
    box.querySelectorAll('path').forEach(pth => {
      const u = M.units.find(x => x.code === pth.dataset.c);
      pth.onmousemove = e => { const r = wrap.getBoundingClientRect(); tip.style.display = 'block'; tip.textContent = u.name;
        tip.style.left = Math.min(e.clientX - r.left + 12, r.width - tip.offsetWidth - 4) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; };
      pth.onmouseleave = () => tip.style.display = 'none';
      const pick = () => { FSEL = u.code; box.querySelectorAll('path.sel').forEach(x => x.classList.remove('sel')); pth.classList.add('sel'); showFront(u); };
      pth.onclick = pick;
      pth.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    });
    const cur = FSEL && M.units.find(u => u.code === FSEL);
    if (cur) showFront(cur); else $('#finfo').innerHTML = `<div class="hint">Click a state or province for details. No front plate on the car? The yellow units are your candidates, plus the purple ones where it is often missing.</div>`;
  }
  function renderRegion(rk) {
    const R = RG[rk], M = RM[rk], box = $('#s-region');
    const units = M.units.slice().sort((a, b) => a.name.localeCompare(b.name));
    box.innerHTML = `<p class="hint" style="margin-top:0">Click a ${esc(R.unit)} to jump to its plates. White: reference plate. Below it: the same design ${R.note ? 'blurred' : 'on Street View'}.</p>` + regionSvg(rk) + mapBar() +
      `<div class="rcards">${units.map(u => { const d = R.units[u.code] || { designs: [] };
        const fr = frontVaries(rk) && frontRule(rk, u.code);
        return `<div class="rcard" id="rc-${u.code}"><h4>${esc(u.name)}</h4>${fr ? `<div class="hint">${FRONT_TXT[fr.k]}</div>` : ''}${d.note ? `<div class="hint">${esc(d.note)}</div>` : ''}${d.designs.map(g =>
          `<div class="design">${g.vehicle ? `<span class="vtag">${VEH[g.vehicle] || esc(g.vehicle)}</span> ` : ''}${g.recent ? '<span class="tag">recent coverage</span>' : ''}<div class="refs">${g.refs.map(r => `<div class="thumb" data-img="${esc(r)}"><img src="${esc(r)}" alt="" loading="lazy"></div>`).join('')}</div>${g.crops.length ? `<div class="strip">${g.crops.map(c => thumbImg(c.img, c.blur, c.sim)).join('')}</div>` : ''}</div>`).join('') || (d.note ? '' : '<div class="hint">No plate yet.</div>')}</div>`; }).join('')}</div>
      <p class="hint">${esc(R.credit || '')}${R.note ? ' ' + esc(R.note) : ''}${R.note_sim ? ' ' + esc(R.note_sim) : ''}</p>`;
    box.querySelector('.rbar .confirm').remove(); box.querySelector('.rbar').insertAdjacentHTML('afterbegin', '<button class="btn confirm hidden-el"></button>');
    wireRegionMap(box, rk, code => {
      box.querySelectorAll('.units path.sel, .rcard.hl').forEach(x => x.classList.remove('sel', 'hl'));
      box.querySelector(`.units path[data-c="${code}"]`).classList.add('sel'); const c = $('#rc-' + code); c.classList.add('hl'); c.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, null);
    const tg = box.querySelector('.rbar .toggle'), mp = box.querySelector('.rmap');
    tg.onclick = () => { S.cities = S.cities === false; save(); mp.classList.toggle('nocities', S.cities === false); tg.textContent = S.cities === false ? 'Show cities' : 'Hide cities'; };
    wireThumbs(box);
  }
  function showFront(u) {
    const r = FR[u.code] || {}, label = (KINDS.find(x => x[0] === r.k) || [, 'No data'])[1];
    $('#finfo').innerHTML = `<div class="name">${esc(u.name)} <span class="step">${COUNTRY_OF(u.code)}</span><span class="tag" style="display:inline-flex;align-items:center;gap:6px"><span class="sw k-${r.k}"></span>${label}</span>${r.since ? `<span class="tag">changed ${r.since}</span>` : ''}</div>${r.note ? `<p>${esc(r.note)}</p>` : ''}`;
  }

  // ---------- chrome ----------
  function wireThumbs(root) { root.querySelectorAll('.thumb').forEach(t => t.onclick = () => openLb(t.dataset.img)); }
  const openLb = src => { $('#lbimg').src = src; $('#lb').classList.add('on'); };
  $('#lb').onclick = () => $('#lb').classList.remove('on');
  $('#qimgwrap').onclick = () => openLb($('#qimg').src);

  function show(which) {
    ['setup', 'quiz', 'summary', 'study'].forEach(id => $('#' + id).classList.toggle('hidden-el', id !== which));
    $('#tab-quiz').classList.toggle('on', which !== 'study');
    $('#tab-study').classList.toggle('on', which === 'study');
    if (which === 'setup') renderSetup();
    if (which === 'study') { if (SV === 'front') renderFront(); else if (SV.startsWith('r:')) renderRegion(SV.slice(2)); else renderStudy(); }
    window.scrollTo(0, 0);
  }
  $('#tab-quiz').onclick = () => { if (Q && Q.i < Q.items.length && !$('#quiz').classList.contains('hidden-el')) return; show('setup'); };
  $('#tab-study').onclick = () => { keyHandler = null; show('study'); };
  $('#quit').onclick = () => { keyHandler = null; Q = null; show('setup'); };
  $('#start').onclick = () => start();

  let keyHandler = null;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('#lb').classList.remove('on'); return; }
    if (keyHandler && !$('#quiz').classList.contains('hidden-el')) keyHandler(e);
  });

  // Deep link: #fr opens Study filtered on that country (ISO 3166-1 alpha-2, as used by Atlas)
  const ISO = {}; COUNTRIES.forEach(c => ISO[c.f.toLowerCase()] = c.n);
  function applyHash() {
    const h = location.hash.slice(1).toLowerCase();
    const open = v => { keyHandler = null; Q = null; show('study'); setView(v); return true; };
    if (h === 'front') return open('front');
    // #r-mx: regional explorer. #mx: the country's own plates if any, else its regional map, else the front plates map
    const rk = h.startsWith('r-') ? h.slice(2) : null;
    if (rk && RG[rk] && RM[rk]) return open('r:' + rk);
    const n = ISO[h];
    if (n && !PLATES.some(p => p.country === n) && RG[h] && RM[h]) return open('r:' + h);
    if (!n) return false;
    // a country with no plate of its own but front-plate rules (Canada) opens the front plates map
    if (!PLATES.some(p => p.country === n) && window.FRONT_RULES && FRONT_RULES[h.toUpperCase()]) return open('front');
    if (SV !== 'plates') setView('plates');
    SC = n; $('#s-search').value = ''; $('#s-cont').value = ''; $('#s-cat').value = 'all';
    keyHandler = null; Q = null; show('study'); return true;
  }
  window.addEventListener('hashchange', applyHash);
  initStudy();
  if (!applyHash()) show('setup');
})();
</script>
</body>
</html>
